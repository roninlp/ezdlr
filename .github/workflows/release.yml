name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            platform: linux/amd64
          - name: windows-amd64
            os: windows-latest
            platform: windows/amd64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            aria2 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install aria2 --no-progress --yes
          if (Test-Path 'C:\mingw64\bin') {
            Add-Content $env:GITHUB_PATH 'C:\mingw64\bin'
          }
          gcc --version

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build application
        shell: bash
        run: |
          wails build \
            -clean \
            -nopackage \
            -platform "${{ matrix.platform }}" \
            -o ezdlr \
            -trimpath \
            -ldflags "-s -w"

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release/ezdlr-linux-amd64
          cp build/bin/ezdlr release/ezdlr-linux-amd64/ezdlr
          cp "$(command -v aria2c)" release/ezdlr-linux-amd64/aria2c
          chmod 755 release/ezdlr-linux-amd64/ezdlr release/ezdlr-linux-amd64/aria2c
          tar -czf release/ezdlr-linux-amd64.tar.gz -C release ezdlr-linux-amd64

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib/ezdlr
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          cp build/bin/ezdlr AppDir/usr/bin/ezdlr
          cp "$(command -v aria2c)" AppDir/usr/lib/ezdlr/aria2c
          cp packaging/arch/ezdlr.desktop AppDir/usr/share/applications/ezdlr.desktop
          cp packaging/arch/ezdlr.svg AppDir/usr/share/icons/hicolor/scalable/apps/ezdlr.svg
          chmod 755 AppDir/usr/bin/ezdlr AppDir/usr/lib/ezdlr/aria2c
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/ezdlr" "$@"
          EOF
          chmod 755 AppDir/AppRun

          curl --fail --location --retry 3 \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output linuxdeploy.AppImage
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool.AppImage
          chmod 755 linuxdeploy.AppImage appimagetool.AppImage
          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/ezdlr.desktop \
            --icon-file AppDir/usr/share/icons/hicolor/scalable/apps/ezdlr.svg
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run \
            AppDir release/ezdlr-linux-amd64.AppImage

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\ezdlr-windows-amd64 | Out-Null
          Copy-Item build\bin\ezdlr release\ezdlr-windows-amd64\ezdlr.exe
          Copy-Item (Get-Command aria2c.exe).Source release\ezdlr-windows-amd64\aria2c.exe
          Compress-Archive -Path release\ezdlr-windows-amd64 -DestinationPath release\ezdlr-windows-amd64.zip

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.AppImage
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
