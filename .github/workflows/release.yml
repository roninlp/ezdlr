name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.0-alpha.11)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
            tags: production,gtk3
            cgo: "1"
            output: ezdlr
          - name: windows-amd64
            os: windows-latest
            goos: windows
            goarch: amd64
            tags: production
            cgo: "0"
            output: ezdlr.exe
          - name: macos-arm64
            os: macos-14
            goos: darwin
            goarch: arm64
            tags: production
            cgo: "1"
            output: ezdlr

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            aria2 \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Install Windows dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install aria2 --no-progress --yes

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install aria2

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

      - name: Build application
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          LDFLAGS="-s -w"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            LDFLAGS="$LDFLAGS -H windowsgui"
          fi
          go build \
            -tags "${{ matrix.tags }}" \
            -trimpath \
            -buildvcs=false \
            -ldflags "$LDFLAGS" \
            -o "bin/${{ matrix.output }}" .

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p release/ezdlr-linux-amd64
          cp bin/ezdlr release/ezdlr-linux-amd64/ezdlr
          cp "$(command -v aria2c)" release/ezdlr-linux-amd64/aria2c
          chmod 755 release/ezdlr-linux-amd64/ezdlr release/ezdlr-linux-amd64/aria2c
          tar -czf release/ezdlr-linux-amd64.tar.gz -C release ezdlr-linux-amd64

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/lib/ezdlr
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/scalable/apps
          cp bin/ezdlr AppDir/usr/bin/ezdlr
          cp "$(command -v aria2c)" AppDir/usr/lib/ezdlr/aria2c
          cp packaging/arch/ezdlr.desktop AppDir/usr/share/applications/ezdlr.desktop
          cp packaging/arch/ezdlr.svg AppDir/usr/share/icons/hicolor/scalable/apps/ezdlr.svg
          cp packaging/arch/ezdlr.desktop AppDir/ezdlr.desktop
          cp packaging/arch/ezdlr.svg AppDir/ezdlr.svg
          chmod 755 AppDir/usr/bin/ezdlr AppDir/usr/lib/ezdlr/aria2c
          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$HERE/usr/bin/ezdlr" "$@"
          EOF
          chmod 755 AppDir/AppRun

          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage \
            --output appimagetool.AppImage
          chmod 755 appimagetool.AppImage
          # WebKitGTK's production helper path is distro-specific. Keep GTK
          # and WebKitGTK host-provided instead of bundling Ubuntu's helpers.
          ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run --no-appstream \
            AppDir release/ezdlr-linux-amd64.AppImage

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\ezdlr-windows-amd64 | Out-Null
          Copy-Item bin\ezdlr.exe release\ezdlr-windows-amd64\ezdlr.exe
          Copy-Item (Get-Command aria2c.exe).Source release\ezdlr-windows-amd64\aria2c.exe
          Compress-Archive -Path release\ezdlr-windows-amd64 -DestinationPath release\ezdlr-windows-amd64.zip

      - name: Package macOS application
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="release/ezdlr-macos-${{ matrix.goarch }}.app"
          mkdir -p "$app/Contents/MacOS"
          cp bin/ezdlr "$app/Contents/MacOS/ezdlr"
          cp "$(command -v aria2c)" "$app/Contents/MacOS/aria2c"
          cat > "$app/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDisplayName</key>
            <string>ezdlr</string>
            <key>CFBundleExecutable</key>
            <string>ezdlr</string>
            <key>CFBundleIdentifier</key>
            <string>com.ezdlr.app</string>
            <key>CFBundleName</key>
            <string>ezdlr</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>${{ github.run_number }}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
          </dict>
          </plist>
          EOF
          chmod 755 "$app/Contents/MacOS/ezdlr" "$app/Contents/MacOS/aria2c"
          ditto -c -k --sequesterRsrc --keepParent "$app" "release/ezdlr-macos-${{ matrix.goarch }}.zip"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            release/*.tar.gz
            release/*.zip
            release/*.AppImage
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.tar.gz
            release/*.zip
            release/*.AppImage
          generate_release_notes: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
